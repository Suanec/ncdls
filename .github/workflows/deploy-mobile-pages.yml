name: Deploy mobile game to Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-mobile-pages.yml'
      - 'web/**'
      - 'web_mobile/**'
      - 'src/**'
      - 'vendor/**'
      - 'assets/**'
      - 'scripts/build-web.cjs'
      - 'scripts/web-runtime-compat.cjs'
      - 'scripts/check-web-runtime.cjs'
      - 'scripts/check-web.cjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build static mobile game
        run: npm run build:mobile
      - name: Verify game and offline resources
        run: npm run check:mobile
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game only
        uses: actions/upload-pages-artifact@v4
        with:
          path: web_mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
