<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="挪车打螺丝本地网页版，复用原游戏资源、玩法与关卡。"
    />
    <title>挪车打螺丝 · 网页版</title>
    <link rel="icon" href="data:," />
    <style>/*__STARTUP_CSS__*/</style>
    <link rel="stylesheet" data-href="launcher.css?v=20261126.2" />
  </head>
  <body>
    <main>
      <iframe
        id="game"
        data-src="game.html?v=20261126.2"
        title="挪车打螺丝游戏"
        allow="autoplay; fullscreen"
      ></iframe>
    </main>
    <section id="startup" aria-labelledby="startup-title">
      <div class="startup-card">
        <p class="startup-name">挪车打螺丝</p>
        <h1 id="startup-title">正在准备游戏</h1>
        <progress id="startup-progress" max="100" aria-label="当前阶段加载进度"></progress>
        <p id="startup-detail" role="status">页面已打开，即将开始加载…</p>
        <p id="startup-time">已等待 0 秒</p>
        <p id="startup-help">首次加载需要网络，进度会在这里显示。</p>
        <button id="startup-retry" type="button">重新加载（保留存档）</button>
      </div>
    </section>
    <button id="open-levels" class="menu" aria-haspopup="dialog">
      选择关卡
    </button>
    <dialog id="levels" aria-labelledby="levels-title">
      <form id="level-form">
        <div class="heading">
          <h1 id="levels-title">选择关卡</h1>
          <button type="button" id="close-levels" aria-label="关闭">×</button>
        </div>
        <label for="mode">玩法</label>
        <select id="mode">
          <option value="0">经典挪车 · 294 套模板</option>
          <option value="2">星星 · 12 套模板</option>
          <option value="3">海洋 · 27 套模板</option>
          <option value="4">冰雪 · 30 套模板</option>
          <option value="5">哪吒 · 30 套模板</option>
        </select>
        <label for="level">关卡</label
        ><input
          id="level"
          type="number"
          min="1"
          step="1"
          value="1"
          required
          inputmode="numeric"
        />
        <p id="level-template">输入正整数关卡号，超过模板数量后循环使用。</p>
        <p>关卡号按输入值保存，游戏自动保存在本浏览器。</p>
        <p class="secondary">版本：20261126.2</p>
        <p class="secondary">猫咪和打巨龙资源尚未缓存，暂不提供入口。</p>
        <p id="menu-status" role="status"></p>
        <button class="primary" type="submit">进入关卡</button>
        <button id="restart-game" type="button">重启游戏（保留存档）</button>
        <p class="secondary">画面异常时可重启；会回到当前关卡开始，保留关卡进度。</p>
        <button id="diagnose-game" type="button">检测卡顿（保留现场）</button>
        <p id="diagnose-summary" role="status"></p>
        <section id="diagnose-result" hidden>
          <p>复制下面不超过 600 字的摘要即可。包含打开菜单前的帧率，检测会保留当前关卡。</p>
          <button id="diagnose-copy" type="button">复制诊断摘要</button>
          <textarea id="diagnose-content" rows="8" readonly aria-label="游戏诊断摘要"></textarea>
          <button id="diagnose-export" type="button">导出完整诊断文件（可选）</button>
          <p id="diagnose-copy-status" role="status"></p>
        </section>
      </form>
    </dialog>
    <script type="application/x-ncdls-script" data-src="launcher.js?v=20261126.2" data-launcher></script>
    <script>/*__STARTUP_JS__*/</script>
  </body>
</html>
