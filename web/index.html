<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="挪车打螺丝本地网页版，复用原游戏资源、玩法与关卡。"
    />
    <title>挪车打螺丝 · 网页版</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="launcher.css?v=20261124.2" />
  </head>
  <body>
    <main>
      <iframe
        id="game"
        src="game.html?v=20261124.2"
        title="挪车打螺丝游戏"
        allow="autoplay; fullscreen"
      ></iframe>
    </main>
    <button id="open-levels" class="menu" aria-haspopup="dialog">
      选择关卡
    </button>
    <dialog id="levels" aria-labelledby="levels-title">
      <form id="level-form">
        <div class="heading">
          <h1 id="levels-title">选择关卡</h1>
          <button type="button" id="close-levels" aria-label="关闭">×</button>
        </div>
        <label for="mode">玩法</label>
        <select id="mode">
          <option value="0">经典挪车 · 294 关</option>
          <option value="2">星星 · 12 关</option>
          <option value="3">海洋 · 27 关</option>
          <option value="4">冰雪 · 30 关</option>
          <option value="5">哪吒 · 30 关</option>
        </select>
        <label for="level">关卡</label
        ><input
          id="level"
          type="number"
          min="1"
          max="294"
          value="1"
          required
          inputmode="numeric"
        />
        <p>选择关卡会切换当前进度，游戏自动保存在本浏览器。</p>
        <p class="secondary">版本：20261124.2</p>
        <p class="secondary">猫咪和打巨龙资源尚未缓存，暂不提供入口。</p>
        <p id="menu-status" role="status"></p>
        <button class="primary" type="submit">进入关卡</button>
        <button id="restart-game" type="button">重启游戏（保留存档）</button>
        <p class="secondary">画面异常时可重启；会回到当前关卡开始，保留关卡进度。</p>
      </form>
    </dialog>
    <script src="launcher.js?v=20261124.2"></script>
  </body>
</html>
